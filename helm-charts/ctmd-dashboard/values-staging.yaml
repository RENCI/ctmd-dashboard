# Staging overlay for the ctmd-dashboard chart (namespace: ctmd-stage), tracked by the
# ArgoCD app `ctmd-staging`. Mirrors the prod overlay but runs in DEV MODE:
# softwareContext=development → AUTH_ENV=development, so the API skips the TIN/REDCap SSO
# auth middleware and /auth_status returns a canned demo user (dev login). Staging still
# syncs REDCap via pipeline2. NO secrets live here — DB/session/REDCap creds come from
# pre-provisioned Secrets (db-dsn-pipeline2, api-session-secret, pipeline2-redcap) that
# must exist in ctmd-stage (see gitops/README.md). Deployed image tags are set by
# env/staging-images.yaml, layered AFTER this file by the ArgoCD Application.

softwareContext: development

images:
  repository: containers.renci.org/ctmd

# OpenShift Route (mirrors prod's ctmd-route); no cert-manager ingress on ASHE.
ingress:
  create: false
route:
  create: true
  name: ctmd-stage-route
  host: ctmd-stage.apps.ashe-k8s.renci.unc.edu
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

api:
  create: true
  name: ctmd-api
  # Deployed image tag is set by env/staging-images.yaml (layered last), not here.
  service:
    apiPort: 3030
    graphicsApiPort: 4040
  sessionSecret:
    # GitOps: reference the pre-provisioned Secret (never create/commit it).
    existingSecret: api-session-secret
    name: api-session-secret
    value: ""
  env:
    DASHBOARD_URL: https://ctmd-stage.apps.ashe-k8s.renci.unc.edu/
    # Dev mode ignores this (auth middleware is skipped), but keep it valid.
    REDCAP_AUTH_URL: https://redcap.vumc.org/plugins/TIN/sso/check_login
  resources:
    limits: { cpu: 500m, memory: 1024Mi }
    requests: { cpu: 200m, memory: 300Mi }

frontend:
  create: true
  name: ctmd-frontend
  # Deployed image tag is set by env/staging-images.yaml (layered last), not here.
  service:
    name: http
    port: 3000
  env:
    REACT_APP_API_ROOT: http://ctmd-api:3030/
    REACT_APP_DATA_API_ROOT: http://ctmd-pipeline2:5000/
  resources:
    limits: { cpu: 500m, memory: 1024Mi }
    requests: { cpu: 200m, memory: 300Mi }

pipeline2:
  create: true
  name: ctmd-pipeline2
  # Deployed image tag is set by env/staging-images.yaml (layered last), not here.
  # GitOps: REDCAP_APPLICATION_TOKEN comes from a pre-provisioned Secret, not inline.
  redcapSecret:
    existingSecret: pipeline2-redcap
    key: REDCAP_APPLICATION_TOKEN
  service:
    port: 5000
  resources:
    limits: { cpu: 1000m, memory: 2Gi }
    requests: { cpu: 200m, memory: 512Mi }
  recurringBackup:
    backupPath: /backups
    size: 5Gi
    persistence:
      # Staging gets a fresh backup PVC (no existing claim to reuse).
      create: true
      existingClaim: ""
  # Dedicated staging DB (ctmd-db2). The db-dsn-pipeline2 Secret is pre-provisioned in
  # ctmd-stage; postgres initializes its password from it (envFrom), so keep them in sync.
  postgres:
    create: true
    name: ctmd-db2
    tag: "17-alpine"
    publicRepository: true
    image: postgres
    dataMountPath: /var/lib/postgresql/data
    pgdataSubdir: pgdata
    service:
      port: 5432
    resources:
      limits: { cpu: 500m, memory: 1Gi }
      requests: { cpu: 200m, memory: 256Mi }
    secrets:
      create: false
      name: db-dsn-pipeline2
      database: postgres
      user: ctmd-user
    persistence:
      create: true
      existingClaim: ""
      storageClass: basic
      size: 5Gi
  env:
    BACKUP_DIR: /backups
    CREATE_TABLES: "1"
    DATABASE_URL: ""
    LOCAL_ENV: "false"
    MAPPING_PATH: /data/mapping.json
    REDCAP_URL_BASE: https://redcap.vumc.org/api/
    SYNC_INTERVAL_HOURS: "24"
    TASK_TIME: "7200"
    USE_SPARK_ETL: "0"
    REDIS_QUEUE_HOST: ctmd-redis
    REDIS_QUEUE_PORT: "6379"
    REDIS_QUEUE_DB: "0"
    REDIS_LOCK_HOST: ctmd-redis
    REDIS_LOCK_PORT: "6379"
    REDIS_LOCK_DB: "2"
    REDIS_LOCK_EXPIRE: "7200"
    REDIS_LOCK_TIMEOUT: "7200"

# Top-level ctmd-db is unused (all services use pipeline2's ctmd-db2).
postgres:
  create: false
  name: ctmd-db
  secrets:
    create: false

redis:
  create: true
  name: ctmd-redis
  tag: "7-alpine"
  publicRepository: true
  args: ["--save", "", "--appendonly", "no"]
  service:
    port: 6379
  resources:
    limits: { cpu: 500m, memory: 1024Mi }
    requests: { cpu: 200m, memory: 300Mi }
