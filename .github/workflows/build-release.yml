# Workflow responsible for the 
# major release processes.
# Builds all associated services and 
# creates a release object in Github

name: Build-Push-Release
on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - README.md.old
      - .github/**
      - LICENSE
      - .gitignore
      - .dockerignore
      # CD image-tag overlays: a staging/prod promotion edits only these. Ignoring them
      # here breaks the write-back loop (so promoting staging does not rebuild/re-release),
      # while Staging Verify still fires on the staging overlay change.
      - helm-charts/ctmd-dashboard/env/**
    tags-ignore:
      - '*'
jobs:
  build-push-release:
    runs-on: ubuntu-latest
    # contents: write lets the staging-promotion step commit the image-tag bump back to main.
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }} 
        fetch-depth: 0

    - name: Set short git commit SHA
      id: vars
      run: |
        echo "SHORT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV
    # https://github.blog/changelog/2022-10-11-github-actions-deprecating-save-state-and-set-output-commands/

    - name: Confirm git commit SHA output
      run: echo ${{ env.SHORT_SHA }}

    # https://github.com/marketplace/actions/git-semantic-version
    - name: Semver Check
      uses: paulhatch/semantic-version@v6.0.2
      id: version
      with:
        # The prefix to use to identify tags
        tag_prefix: "v"
        # A string which, if present in a git commit, indicates that a change represents a
        # major (breaking) change, supports regular expressions wrapped with '/'
        major_pattern: "/breaking:|major:/"
        # A string which indicates the flags used by the `major_pattern` regular expression. Supported flags: idgs
        major_regexp_flags: "ig"
        # Same as above except indicating a minor change, supports regular expressions wrapped with '/'
        minor_pattern: "/feat:|feature:|minor:/"
        # A string which indicates the flags used by the `minor_pattern` regular expression. Supported flags: idgs
        minor_regexp_flags: "ig"
        # A string to determine the format of the version output
        # version_format: "${major}.${minor}.${patch}-prerelease${increment}"
        version_format: "${major}.${minor}.${patch}"
        search_commit_body: false

    - name: Set Semver in Github Env 
      run: |
        echo "SEMVER=v${{ steps.version.outputs.version }}" >> $GITHUB_ENV
        echo "Sanity Check for Semver: $SEMVER"

    - name: Build-Api
      uses: ./.github/actions/build-service
      with:
        app-name: 'api'
        tag: '${{ env.SHORT_SHA }}'
        release-tag: '${{ env.SEMVER }}'
        docker-name: ${{ secrets.DOCKERHUB_USERNAME }}
        docker-token: ${{ secrets.DOCKERHUB_TOKEN }}
        container-name: ${{ secrets.CONTAINERHUB_USERNAME }}
        container-token: ${{ secrets.CONTAINERHUB_TOKEN }}

    - name: Build-Frontend
      uses: ./.github/actions/build-service
      with:
        app-name: 'frontend'
        tag: '${{ env.SHORT_SHA }}'
        release-tag: '${{ env.SEMVER }}'
        docker-name: ${{ secrets.DOCKERHUB_USERNAME }}
        docker-token: ${{ secrets.DOCKERHUB_TOKEN }}
        container-name: ${{ secrets.CONTAINERHUB_USERNAME }}
        container-token: ${{ secrets.CONTAINERHUB_TOKEN }}

    - name: Build-Pipeline2
      uses: ./.github/actions/build-service
      with:
        app-name: 'pipeline2'
        tag: '${{ env.SHORT_SHA }}'
        release-tag: '${{ env.SEMVER }}'
        docker-name: ${{ secrets.DOCKERHUB_USERNAME }}
        docker-token: ${{ secrets.DOCKERHUB_TOKEN }}
        container-name: ${{ secrets.CONTAINERHUB_USERNAME }}
        container-token: ${{ secrets.CONTAINERHUB_TOKEN }}

#==========================TAG & RELEASE W/ NOTES =========================

    # Note: GITHUB_TOKEN is autogenerated feature of github app
    # which is auto-enabled when using github actions.
    # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
    # https://docs.github.com/en/rest/git/tags?apiVersion=2022-11-28#create-a-tag-object
    # https://docs.github.com/en/rest/git/refs?apiVersion=2022-11-28#create-a-reference
    # This creates a "lightweight" ref tag.
    - name: Create Tag for Release
      run: |
        curl \
        -s --fail -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/${{ github.repository }}/git/refs \
        -d '{"ref":"refs/tags/v${{ steps.version.outputs.version }}","sha":"${{ github.sha }}"}'
        
#   https://cli.github.com/manual/gh_release_create
    - name: Create Release
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ env.RELEASE_VERSION }} \
          -t "${{ env.RELEASE_VERSION }}" \
          --generate-notes \
          --latest

#==========================PROMOTE TO STAGING (GitOps write-back) =========================
    # Rewrite the three image tags in the staging overlay and commit back to main.
    # ArgoCD's `ctmd-staging` app watches main and auto-syncs ctmd-stage to $SEMVER.
    # No [skip ci]: build-release ignores env/** (so this won't rebuild), but Staging
    # Verify intentionally fires on this staging-images.yaml change.
    - name: Promote to staging (write image tags)
      run: |
        set -euo pipefail
        FILE="helm-charts/ctmd-dashboard/env/staging-images.yaml"
        # The overlay contains exactly the three app tags; set them all to $SEMVER.
        sed -i -E "s|^([[:space:]]*tag:[[:space:]]*).*|\\1${SEMVER}|" "$FILE"
        git config user.name  "ctmd-ci[bot]"
        git config user.email "ctmd-ci@users.noreply.github.com"
        git fetch origin main
        git checkout main
        sed -i -E "s|^([[:space:]]*tag:[[:space:]]*).*|\\1${SEMVER}|" "$FILE"
        if git diff --quiet -- "$FILE"; then
          echo "staging already at ${SEMVER}; nothing to promote"
          exit 0
        fi
        git add "$FILE"
        git commit -m "chore(cd): staging → ${SEMVER}"
        git push origin main