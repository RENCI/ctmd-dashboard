name: Build-Frontend
on:

    push:
     branches-ignore:
      - master
      - main
      - develop
     paths:
     - services/frontend/**
     tags-ignore:
       - '*'
    # workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-${{ github.workflow }}-buildfrontend
  cancel-in-progress: true   

jobs:
  build-push-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Obtain the branch being developed
    - name: Set branch name
      id: branch
      run: |
        REF=${{ github.ref_name }}
        echo "GHR=${REF%/*}" >> $GITHUB_ENV

    # Run the frontend unit tests before building — a failing test blocks the image.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Frontend unit tests
      working-directory: services/frontend
      run: |
        npm ci --legacy-peer-deps
        CI=true npm test

    - uses: ./.github/actions/build-service
      with:
        app-name: 'frontend'
        tag: 'test_${{ env.GHR }}'
        docker-name: ${{ secrets.DOCKERHUB_USERNAME }}
        docker-token: ${{ secrets.DOCKERHUB_TOKEN }}
        container-name: ${{ secrets.CONTAINERHUB_USERNAME }}
        container-token: ${{ secrets.CONTAINERHUB_TOKEN }}