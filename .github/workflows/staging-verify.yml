# Informational post-deploy verification for STAGING.
# Fires when the staging image-tag overlay changes (i.e. after a merge promotes to staging).
# Runs the per-interface unit suites (which run anywhere) and writes a PASS/FAIL table to the
# run summary. Never blocks prod — all steps use continue-on-error.
#
# NOTE: the live-URL checks (wait-for-staging + Playwright smoke) are CURRENTLY COMMENTED OUT
# below. The staging Route (ctmd-stage.apps.ashe-k8s.renci.unc.edu) is UNC-network-internal,
# so GitHub cloud runners can't reach it (HTTP 000) — running them there just wastes time.
# Re-enable them on a self-hosted runner on the UNC network to smoke-test live staging.
name: Staging Verify
on:
  push:
    branches: [main]
    paths:
      - helm-charts/ctmd-dashboard/env/staging-images.yaml
  workflow_dispatch: {}

env:
  STAGING_URL: https://ctmd-stage.apps.ashe-k8s.renci.unc.edu

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'  # parity with build-api.yml / build-frontend.yml

      # ---- per-interface unit tests (do not require a live env) ----
      - name: API unit tests
        id: api_tests
        continue-on-error: true
        working-directory: services/api
        run: |
          npm ci || npm install
          npm test

      - name: Frontend unit tests
        id: fe_tests
        continue-on-error: true
        working-directory: services/frontend
        env:
          CI: "true"
        run: |
          # --legacy-peer-deps: Material-UI v4 doesn't declare React 18 support (matches the
          # frontend Dockerfile); plain `npm ci` fails ERESOLVE otherwise.
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm test -- --watchAll=false

      # ---- live-URL checks DISABLED for now ----
      # The staging Route is UNC-network-internal, so GitHub cloud runners can't reach it
      # (HTTP 000). Commented out so we don't waste runner time. Re-enable both steps on a
      # self-hosted runner on the UNC network (and switch `runs-on` above accordingly) to
      # smoke-test live staging after ArgoCD rolls it.
      #
      # - name: Wait for staging to serve
      #   id: wait
      #   continue-on-error: true
      #   run: |
      #     echo "Polling ${STAGING_URL} ..."
      #     for i in $(seq 1 8); do
      #       code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "${STAGING_URL}/" || echo 000)
      #       echo "attempt $i: HTTP $code"
      #       if [ "$code" = "200" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
      #       sleep 8
      #     done
      #     echo "ready=false" >> "$GITHUB_OUTPUT"
      #
      # - name: Smoke tests vs staging
      #   id: smoke
      #   if: steps.wait.outputs.ready == 'true'
      #   continue-on-error: true
      #   working-directory: services/frontend/smoke-tests
      #   env:
      #     SMOKE_BASE_URL: ${{ env.STAGING_URL }}
      #   run: |
      #     npm ci || npm install
      #     npm run install-browser
      #     npm test

      # ---- summary (always runs) ----
      - name: Summary
        if: always()
        run: |
          {
            echo "## Staging verify — informational"
            echo ""
            echo "Target: ${STAGING_URL}"
            echo ""
            echo "| Suite | Result |"
            echo "|-------|--------|"
            echo "| API unit tests | ${{ steps.api_tests.outcome }} |"
            echo "| Frontend unit tests | ${{ steps.fe_tests.outcome }} |"
            echo "| Live smoke (vs staging) | disabled — needs UNC-network runner |"
            echo ""
            echo "_Informational only — does not gate prod promotion._"
          } >> "$GITHUB_STEP_SUMMARY"
