name: Build-Pipeline2
on:
    push:
     branches-ignore:
      - master
      - main
      - develop
     paths:
     - services/pipeline2/**
     tags-ignore:
     - '*'
    workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-${{ github.workflow }}-buildpipeline2
  cancel-in-progress: true

jobs:
  build-push-pipeline2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Obtain the branch being developed
    - name: Set branch name
      id: branch
      run: |
        REF=${{ github.ref_name }}
        echo "GHR=${REF%/*}" >> $GITHUB_ENV

    # Run the pipeline2 unit tests before building — a failing test blocks the image
    # (mirrors build-api.yml / build-frontend.yml). CTMD-197.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Pipeline2 unit tests
      working-directory: services/pipeline2
      run: |
        pip install -r requirements.txt
        python -m pytest tests/

    - uses: ./.github/actions/build-service
      with:
        app-name: 'pipeline2'
        tag: 'test_${{ env.GHR }}'
        docker-name: ${{ secrets.DOCKERHUB_USERNAME }}
        docker-token: ${{ secrets.DOCKERHUB_TOKEN }}
        container-name: ${{ secrets.CONTAINERHUB_USERNAME }}
        container-token: ${{ secrets.CONTAINERHUB_TOKEN }}
